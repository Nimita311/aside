<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aside</title>
  <!-- Root-absolute so assets resolve on a cold load of a nested route path -->
  <link rel="stylesheet" href="/-/assets/style.css">
</head>
<body>

  <div class="layout workspace-frame" id="workspace-frame" data-frame="compact" data-reader="chooser">
    <details class="data-diagnostics" id="data-diagnostics" hidden><summary id="data-diagnostics-summary"></summary><div id="data-diagnostics-files"></div></details>
    <aside id="navigation-sidebar-host" class="navigation-sidebar-host" aria-label="Navigation" hidden>
      <div id="navigation-sidebar" class="navigation-sidebar"></div>
      <div class="navigation-footer">
        <div id="navigation-timeline-slot">
          <section id="workspace-timeline-controls" class="workspace-timeline-controls" aria-label="Timeline controls" hidden>
            <div id="navigation-filter-slot"></div>
            <div id="timeline-calendar-inline"></div>
          </section>
        </div>
        <div class="workspace-actions">
          <button class="workspace-search-trigger" id="btn-navigation-search" type="button" aria-label="Search" aria-haspopup="dialog" aria-expanded="false" aria-controls="workspace-popover"><span aria-hidden="true">⌕</span> Search <kbd>/</kbd></button>
          <button class="btn-icon" id="btn-navigation-more" type="button" aria-label="More options" aria-haspopup="dialog" aria-expanded="false" aria-controls="workspace-popover">•••</button>
        </div>
      </div>
    </aside>
    <section id="instance-chooser" class="instance-chooser" aria-label="Instance picker" hidden>
      <div id="instance-notice"></div>
      <ul id="instance-list" aria-label="Instances"></ul>
      <button class="instance-add-card" id="btn-add-instance" aria-expanded="false" aria-controls="instance-add-form">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Add instance</span>
      </button>
      <form id="instance-add-form" class="instance-add-form" hidden>
        <h2>Add instance</h2>
        <label for="instance-add-path">Instance path</label>
        <p id="instance-add-help">Choose an existing Aside folder or enter its path.</p>
        <div class="instance-add-input">
          <input id="instance-add-path" type="text" placeholder="~/Aside" autocomplete="off" spellcheck="false" aria-describedby="instance-add-help instance-add-error">
          <button class="btn" id="btn-browse-instance" type="button">Browse…</button>
        </div>
        <p id="instance-add-error" role="status"></p>
        <div class="instance-add-actions">
          <button class="btn" id="btn-cancel-add-instance" type="button">Cancel</button>
          <button class="btn btn-primary" type="submit">Add instance</button>
        </div>
      </form>
      <button class="notice-action" id="btn-retry-instances" hidden>Retry</button>
    </section>
    <div class="flow-scroll" id="flow-scroll">
      <main class="flow" id="flow" aria-label="Entries"></main>
    </div>
    <section class="doc-backdrop" id="doc-backdrop" aria-label="Document" tabindex="-1" hidden>
      <button id="btn-doc-close" type="button" hidden aria-label="Return to flow"></button>
      <div class="doc-window"><main class="doc-body" id="doc-body" aria-label="Document content" tabindex="-1"></main></div>
    </section>
    <aside class="side-panel" id="side-panel" aria-label="Context panel" data-extent="summary" data-detail="summary" hidden inert>
      <div class="context-panel-navigation" role="group" aria-label="Context navigation">
        <button id="btn-context-back" class="btn-icon" type="button" aria-label="Previous context" title="Previous context" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M5 12h14"/></svg></button>
        <button id="btn-context-forward" class="btn-icon" type="button" aria-label="Next context" title="Next context" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5 7 7-7 7M5 12h14"/></svg></button>
      </div>
      <button id="btn-context-timeline" class="btn-icon context-timeline-toggle context-panel-action" type="button" aria-label="Filter timeline" title="Filter timeline" hidden><svg class="context-filter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M7 12h10M10 18h4"/></svg><svg class="context-jump-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></button>
      <div id="context-panel-view" class="context-panel-view" role="tablist" aria-label="Panel view" hidden>
        <button id="btn-context-content" type="button" role="tab" aria-controls="side-panel-body" aria-selected="false">Content</button>
        <button id="btn-context-overview" type="button" role="tab" aria-controls="side-panel-body" aria-selected="true">Overview</button>
      </div>
      <div class="context-panel-tools" role="group" aria-label="Context panel controls">
        <button id="btn-context-fullscreen" class="btn-icon" type="button" aria-label="Full screen" title="Full screen" disabled><svg class="context-fullscreen-enter" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M21 3l-7 7M9 21H3v-6M3 21l7-7"/></svg><svg class="context-fullscreen-exit" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14h6v6M10 14l-7 7M20 10h-6V4M14 10l7-7"/></svg></button>
        <button id="btn-context-expand" class="btn-icon" type="button" aria-label="Expand details" title="Expand details" aria-expanded="false" aria-controls="side-panel-body"><svg class="context-expand-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg><svg class="context-contract-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 17 5-5-5-5M13 17l5-5-5-5"/></svg></button>
        <button id="btn-side-panel-close" class="btn-icon" type="button" aria-label="Close context" title="Close context"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="side-panel-body" id="side-panel-body"></div>
      <button id="side-panel-resize" class="side-panel-resize" type="button" role="separator" aria-label="Resize context panel" aria-orientation="vertical" aria-controls="side-panel" aria-valuemin="280" aria-valuenow="304"></button>
    </aside>
    <div id="workspace-control-surface" role="group" aria-label="Workspace controls">
    <div class="control-pill" id="control-pill" role="group" aria-label="Workspace controls">
      <div class="control-pill-actions">
        <button id="btn-workspace-views" class="control-pill-view" type="button" aria-label="Choose view" aria-describedby="workspace-pill-label" aria-haspopup="dialog" aria-expanded="false" aria-controls="workspace-popover"><span id="workspace-pill-label">Aside</span><span aria-hidden="true">⌃</span></button>
        <span class="control-pill-divider" aria-hidden="true"></span>
        <button id="btn-pill-search" class="btn-icon" type="button" aria-label="Search" aria-haspopup="dialog" aria-expanded="false" aria-controls="workspace-popover"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
        <button id="btn-workspace-calendar" class="btn-icon" type="button" aria-label="Timeline calendar" aria-haspopup="dialog" aria-expanded="false" aria-controls="workspace-popover"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg></button>
        <button id="btn-pill-more" class="btn-icon" type="button" aria-label="More options" aria-haspopup="dialog" aria-expanded="false" aria-controls="workspace-popover">•••</button>
      </div>
      <div id="pill-filter-slot"></div>
    </div>
    <button id="workspace-popover-dismiss" class="workspace-popover-dismiss" type="button" tabindex="-1" aria-hidden="true" hidden></button>
    <section id="workspace-popover" class="workspace-popover" role="region" aria-labelledby="workspace-popover-title" tabindex="-1" hidden>
      <div class="workspace-popover-heading"><span id="workspace-popover-title">Views</span><button id="btn-workspace-popover-close" class="btn-icon" type="button" aria-label="Close controls">×</button></div>
      <div id="workspace-popover-body" class="workspace-popover-body"></div>
    </section>
    </div>
    <div id="workspace-parking" hidden inert>
      <div id="workspace-view-content">
        <h1 class="app-title"><a href="/" title="Choose an instance">Aside</a></h1>
        <div id="instance-switcher" class="instance-switcher">
          <button id="btn-instance-switch" class="instance-switch-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="instance-switch-menu"><span id="instance-name">Choose an instance</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <div id="instance-switch-menu" class="instance-switch-menu" role="dialog" aria-label="Switch instance" hidden>
            <div class="instance-menu-heading"><span>Switch instance</span><button id="btn-close-instance-switch" class="btn-icon" type="button" aria-label="Close instance switcher">×</button></div>
            <input id="instance-switch-search" type="search" placeholder="Find an instance…" aria-label="Find an instance" autocomplete="off">
            <div id="instance-switch-list" role="listbox" aria-label="Instances"></div>
            <div class="instance-menu-footer"><button id="btn-all-instances" type="button">All instances</button></div>
          </div>
        </div>
        <p class="workspace-current-label" id="workspace-current-label">Entries</p>
        <div id="workspace-navigation-list" class="workspace-navigation-list"><nav id="workspace-core-views" aria-label="Views">
          <a id="nav-entries" class="navigation-link" href="/"><span class="navigation-entry-icon" aria-hidden="true"></span><span>Entries</span></a>
          <a id="nav-overview" class="navigation-link" href="/"><span>Overview</span></a>
        </nav>
        <div id="workspace-sections" hidden></div>
        </div>
      </div>
      <div class="search-wrapper">
          <select id="search-mode" class="search-mode" aria-label="Search mode" aria-describedby="search-help">
            <option value="text">Text</option>
            <option value="regex">Regex</option>
            <option value="semantic">Semantic</option>
          </select>
          <div class="search-field">

            <input
              type="search"
              class="search-input"
              placeholder="Search entries, projects, actions, artifacts..."
              aria-label="Search"
              aria-describedby="search-help"
              role="combobox"
              aria-autocomplete="list"
              aria-haspopup="listbox"
              aria-controls="search-listbox"
              aria-expanded="false"
              autocomplete="off"
            >
          </div>
          <span id="search-help" class="sr-only">Text: all words must match. Use type prefixes or date ranges.</span>
          <div id="search-results" class="search-results" hidden>
            <div id="search-listbox" role="listbox" aria-label="Search results"></div>
          </div>
        </div>
      <div id="workspace-more-content" class="workspace-menu">
        <button id="btn-workspace-pin" type="button">Pin this view</button>
        <div id="workspace-sort" class="workspace-menu" role="group" aria-label="Entry order" hidden><button id="btn-sort-newest" type="button" aria-pressed="false">Newest first</button><button id="btn-sort-oldest" type="button" aria-pressed="false">Oldest first</button></div>
        <button id="btn-workspace-summary" type="button">Summary</button>
        <button id="btn-inspect-view" type="button">View details</button>
        <button id="btn-workspace-back" type="button" hidden>Return to flow</button>
        <button class="btn-icon" id="btn-settings" aria-label="Settings" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        <span>Settings</span></button>
        <button class="btn-icon" id="btn-theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        <span>Appearance</span></button>
      </div>
      <div id="workspace-inspection-content"><button id="btn-workspace-inspection-back" class="workspace-back" type="button">← More</button><div id="workspace-inspection" class="workspace-inspection"></div></div>
      <div id="workspace-filter-group" class="workspace-filter-group"><div class="filter-pill" id="source-filter" role="group" aria-label="Entry view filter" hidden></div><div class="filter-pill" id="filter-pill" hidden></div><span class="flow-search-chip" id="flow-search" role="group" aria-label="Flow search filter" hidden>
              <button id="btn-edit-flow-search" type="button"></button>
              <button id="btn-clear-flow-search" type="button" aria-label="Clear flow search" title="Clear flow search">×</button>
            </span></div>
      <button class="btn-icon connection-indicator" id="connection-status" aria-label="Offline" title="Offline. Click to reconnect." hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 2 20 20M8.5 8.5a16 16 0 0 1 13 1M2.5 9.5a16 16 0 0 1 3-1.6M5 13a10 10 0 0 1 4-2m5-0.2A10 10 0 0 1 19 13M8.5 16.5a5 5 0 0 1 7 0M12 20h.01"/></svg>
        </button>
    </div>
  </div>

  <dialog class="modal-backdrop" id="modal-backdrop" aria-labelledby="modal-datasource-title" tabindex="-1" hidden>
    <div class="modal" id="modal-datasource">
      <header class="modal-header">
        <h2 class="modal-title" id="modal-datasource-title">Settings</h2>
        <button class="btn-icon modal-close" id="btn-modal-close" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <div class="modal-body">
        <div class="settings-section" id="setting-instance-status" hidden></div>
        <div class="settings-section">
          <h3 class="settings-heading">Display</h3>
          <div class="form-row">
            <label class="form-label" for="setting-date-format">Date format</label>
            <select class="form-select" id="setting-date-format">
              <option value="short">Short</option>
              <option value="medium">Medium</option>
              <option value="long">Long</option>
              <option value="full">Full</option>
              <option value="iso">ISO</option>
            </select>
          </div>
          <div class="form-row">
            <label class="form-label" for="setting-time-style">Time format</label>
            <select class="form-select" id="setting-time-style">
              <option value="short">Short</option>
              <option value="medium">Medium</option>
              <option value="long">Long</option>
              <option value="full">Full</option>
            </select>
          </div>
          <div class="form-row">
            <label class="form-label" for="setting-time-format">Clock</label>
            <select class="form-select" id="setting-time-format">
              <option value="12h">12-hour</option>
              <option value="24h">24-hour</option>
            </select>
          </div>
          <div class="form-row date-time-preview">
            <span class="form-label">Preview</span>
            <output id="setting-date-time-preview" aria-live="polite" aria-atomic="true"></output>
          </div>
          <div class="form-row">
            <label class="form-label" for="setting-week-start">Week starts on</label>
            <select class="form-select" id="setting-week-start">
              <option value="0">Sunday</option>
              <option value="1" selected>Monday</option>
              <option value="2">Tuesday</option>
              <option value="3">Wednesday</option>
              <option value="4">Thursday</option>
              <option value="5">Friday</option>
              <option value="6">Saturday</option>
            </select>
          </div>
          <div class="form-row">
            <label class="form-label" for="setting-anim-speed">Animation</label>
            <select class="form-select" id="setting-anim-speed">
              <option value="0">Off</option>
              <option value="0.5">Fast</option>
              <option value="1">Normal</option>
              <option value="2">Slow</option>
            </select>
          </div>
          <div class="form-row">
            <span class="form-label" id="expand-tags-label">Expand tags</span>
            <div class="form-checkboxes" role="group" aria-labelledby="expand-tags-label">
              <label class="form-checkbox"><input type="checkbox" id="setting-expand-projects"> Projects</label>
              <label class="form-checkbox"><input type="checkbox" id="setting-expand-actions"> Actions</label>
            </div>
          </div>
        </div>
        <div class="settings-section">
          <h3 class="settings-heading">Keyboard</h3>
          <label class="form-checkbox"><input type="checkbox" id="setting-search-shortcut"> Press / to focus search</label>
        </div>
      </div>
    </div>
  </dialog>

  <script type="module" src="/-/assets/app.js"></script>
</body>
</html>
